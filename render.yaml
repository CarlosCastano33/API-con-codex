services:
  - type: web
    name: hola-mundo-api
    runtime: java
    plan: free
    buildCommand: mvn clean package -DskipTests
    startCommand: java -jar target/hola-mundo-api-0.0.1-SNAPSHOT.jar
    envVars:
      - key: JAVA_VERSION
        value: 21
      - key: CORS_ALLOWED_ORIGINS
        value: "*"
